version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uitu_ums_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: uitu_ums
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ums-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uitu_ums_portal
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/uitu_ums?schema=public"
      JWT_SECRET: "uit-production-jwt-token-secret-key-2026"
      JWT_REFRESH_SECRET: "uit-production-refresh-token-secret-key-2026"
      PORT: 3000
      NODE_ENV: "production"

volumes:
  pgdata:

